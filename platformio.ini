[env:esp32s3_MMC1BIT_CAM_8MB_OTA]
lib_deps =
    ${env.lib_deps}
build_flags = 
    ${env.build_flags}
    '-DOTAPASSWORD="RedCanary"'
    -DUSE_MMC_CARD
    -DMMC_CLK=39
    -DMMC_CMD=38
    -DMMC_DATA0=40
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board = esp32-s3-devkitc-1
board_build.partitions = partitions/spiffs_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
;upload_flags= --auth="RedCanary"
;upload_protocol = espota
;upload_port=ESPRedCanary.local 
