[env:esp32_s3_MMC_CARD_8MB]
platform = ${env.platform32}
lib_deps =
    ${env.lib_deps}
build_flags = 
    ${env.build_flags}
    '-DOTAPASSWORD="RedCanary"'
    -DUSE_MMC_CARD
    -DMMC_CLK=39
    -DMMC_CMD=38
    -DMMC_DATA0=40
;   Do not use the DATA1, DATA2, DATA3 for 1 BIT mode
;    -DMMC_DATA1=41
;    -DMMC_DATA2=42
;    -DMMC_DATA3=43
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board = esp32-s3-devkitc-1
;debug_tool = esp-builtin
;debug_build_flags = -g3 -O0
;debug_init_break = tbreak setup
; debug_port = 
firmwaredir = esp32-s3-MMC-CARD-8MB
board_build.partitions = partitions/spiffs_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
;upload_flags= --auth="RedCanary"
;upload_protocol = espota
;upload_port=ESPRedCanary.local 

